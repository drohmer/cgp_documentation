# lhtml-site configuration of prototype A (CGP documentation).
# _build/ is generated by build.py (do not edit it): the sources assembled from
# ../content, pages/ and the reference pages generated from api.json, and the
# theme (the bundled docs theme of lhtml-site + theme/, the CGP overlay).
source_directory: '_build/src/'
site_directory: 'dist/'
theme: '_build/theme/'
deck: '_build/deck.yaml'
# Path of the site on its server (the 404 page links from the root, at any depth of URL):
# '/' when dist/ is served at the root (local tests); change it for a sub-folder ('/cgp/').
base_url: '/'
plugin:
  - 'plugins/cgp_content.py'
# Settings of the docs theme (README of the theme in lhtml-site, themes/docs/README.md)
keywords:
  docs:
    name: CGP
    sub: docs
    title: CGP docs
    storage: cgp                      # localStorage keys cgp-theme, cgp-menu-open
    logo_svg: '<svg viewBox="0 0 32 32" width="26" height="26"><path d="M16 3 28 10v12L16 29 4 22V10z" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"/><path d="M4 10l12 7 12-7M16 17v12" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linejoin="round"/></svg>'
    repo_url: https://github.com/drohmer/cgp-2027
    repo_label: CGP on GitHub
    footer: CGP - Computer Graphics Programming. Built with lhtml-site.
    section_index:                    # breadcrumb: the index page of these sections
      How-to: how-to/index.html
      Reference: reference/index.html
    css: [theme/css/cgp.css]          # loaded after the docs.css of the theme
    js: [theme/js/cgp.js]             # run after the site.js of the theme
    menu:
      sections: [Get started, Understand, How-to, Examples, Reference]
      section:
        Reference:                    # one group per type family, all closed at first
          open: false
          groups: closed
          group_link_class: mono      # type names
          plain_groups: [Utilities]       # pages of functions, not type names
