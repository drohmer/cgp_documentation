<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 360" width="700" height="360">
  <style>
    text { font-family: Helvetica, Arial, sans-serif; font-size: 14px; fill: #333333; }
    .b { font-weight: bold; }
    .t { fill: #1a6b73; }
    .s { font-size: 13px; fill: #666666; }
    .m { font-family: Menlo, Consolas, monospace; font-size: 12px; fill: #333333; }
    .box { fill: #dcf1f3; stroke: #3a9aa5; stroke-width: 1.4; }
    .ar { stroke: #2a8f99; stroke-width: 2; fill: none; marker-end: url(#ac); }
  </style>
  <defs>
    <marker id="ac" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2a8f99"/></marker>
  </defs>
  <text x="20" y="24" class="b">display_frame(): the same cube drawn twice, one image</text>
  <rect x="20" y="44" width="362" height="104" rx="6" class="box"/>
  <text x="34" y="68" class="b t">1. camera_control (mouse)</text>
  <text x="34" y="90" class="m">camera_view = V1   (changes with the mouse)</text>
  <text x="34" y="109" class="m">light = position of camera 1</text>
  <text x="34" y="128" class="m">cube: no rotation, at (0,0,0)</text>
  <rect x="20" y="176" width="362" height="104" rx="6" class="box"/>
  <text x="34" y="200" class="b t">2. camera2_control (look_at every frame)</text>
  <text x="34" y="222" class="m">camera_view = V2   (eye (8,0.5,0), fixed)</text>
  <text x="34" y="241" class="m">light = (7,1,0)</text>
  <text x="34" y="260" class="m">cube: rotated by timer.t around y, at (0,2.5,0)</text>
  <text x="20" y="312" class="s">Same projection P and same depth buffer for both passes:</text>
  <text x="20" y="331" class="s">nothing is cleared between them.</text>
  <rect x="418" y="44" width="262" height="236" fill="#ffffff" stroke="#999999" stroke-width="1.4"/>
  <text x="549.0" y="302" class="s" text-anchor="middle">the window: one color and depth buffer</text>
  <polygon points="545,115 590.0,140.2 545,165.4 500.0,140.2" fill="#e2c08f" stroke="#9a6d36" stroke-width="1.2"/>
  <polygon points="500.0,140.2 545,165.4 545,221.2 500.0,196.0" fill="#c99a5b" stroke="#9a6d36" stroke-width="1.2"/>
  <polygon points="590.0,140.2 545,165.4 545,221.2 590.0,196.0" fill="#9a6d36" stroke="#9a6d36" stroke-width="1.2"/>
  <rect x="519" y="60" width="52" height="46" fill="#c99a5b" stroke="#9a6d36" stroke-width="1.2"/>
  <line x1="536" y1="60" x2="536" y2="106" stroke="#9a6d36"/>
  <line x1="554" y1="60" x2="554" y2="106" stroke="#9a6d36"/>
  <text x="581" y="80" class="s">pass 2: fixed on</text>
  <text x="581" y="97" class="s">the screen</text>
  <text x="430" y="266" class="s">pass 1: follows the mouse</text>
  <path d="M382,96 C410,96 420,190 480,190" class="ar"/>
  <path d="M382,228 C410,228 420,83 513,83" class="ar"/>
</svg>
