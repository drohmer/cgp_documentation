<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 470" width="700" height="470">
  <style>
    text { font-family: Helvetica, Arial, sans-serif; font-size: 14px; fill: #666666; }
    .in { fill: #333; }
    .b { font-weight: bold; }
    .m { font-family: Menlo, Consolas, monospace; font-size: 13px; fill: #333; }
    .u { font-family: Menlo, Consolas, monospace; font-size: 13px; fill: #7b48c4; }
    .s { font-size: 13px; }
    .base { fill: #f4f4f4; stroke: #999999; stroke-width: 1.5; }
    .env { fill: #e3eefb; stroke: #6b9bd8; stroke-width: 1.5; }
    .sep { stroke: #c9d9ef; stroke-width: 1; }
  </style>

  <text x="20" y="24" class="b in">In cgp: an empty base class</text>
  <rect x="20" y="36" width="660" height="76" rx="8" class="base"/>
  <text x="34" y="60" class="m b">environment_generic_structure</text>
  <text x="34" y="82" class="m">static bool default_expected_uniform = true;</text>
  <text x="34" y="102" class="m">virtual void send_opengl_uniform(shader, expected) const;</text>
  <text x="666" y="102" class="s" text-anchor="end">does nothing</text>

  <!-- inheritance arrow (UML) -->
  <line x1="120" y1="150" x2="120" y2="126" stroke="#666" stroke-width="1.5"/>
  <polygon points="120,113 111,127 129,127" fill="#ffffff" stroke="#666" stroke-width="1.5"/>
  <text x="138" y="136" class="s">derived in your project, src/environment.hpp, which overrides send_opengl_uniform</text>

  <rect x="20" y="150" width="660" height="214" rx="8" class="env"/>
  <text x="34" y="174" class="m b">environment_structure : environment_generic_structure</text>
  <text x="34" y="200" class="s b in">field</text>
  <text x="200" y="200" class="s b in">uniform sent</text>
  <text x="330" y="200" class="s b in">set each frame (default scene) by</text>
  <line x1="30" y1="210" x2="670" y2="210" class="sep"/>

  <text x="34" y="232" class="m">camera_view</text>
  <text x="200" y="232" class="u">view</text>
  <text x="330" y="232" class="m">camera_control.camera().matrix_view()</text>

  <text x="34" y="258" class="m">camera_projection</text>
  <text x="200" y="258" class="u">projection</text>
  <text x="330" y="258" class="m">camera_projection.matrix()</text>

  <text x="34" y="284" class="m">light</text>
  <text x="200" y="284" class="u">light</text>
  <text x="330" y="284" class="m">camera_control.camera_model.position()</text>

  <text x="34" y="310" class="m">uniform_generic</text>
  <text x="200" y="310" class="u">each key</text>
  <text x="330" y="310" class="s in">you, e.g.</text>
  <text x="394" y="310" class="m">uniform_float["time"] = t;</text>
  <text x="46" y="330" class="s">maps uniform_int, uniform_float, uniform_vec2/3/4, uniform_mat2/3/4: name to value</text>

  <line x1="30" y1="338" x2="670" y2="338" class="sep"/>
  <text x="34" y="356" class="m">background_color</text>
  <text x="200" y="356" class="s">none</text>
  <text x="330" y="356" class="s">used by glClearColor, default (1, 1, 1)</text>

  <text x="20" y="396" class="s in">Every draw(drawable, environment) calls environment.send_opengl_uniform(drawable.shader)</text>
  <text x="20" y="416" class="s in">after the uniforms of the drawable: one environment is shared by all the shapes.</text>
  <text x="20" y="444" class="s">light is sent with expected = false: no warning if the shader has no light uniform.</text>
  <text x="20" y="464" class="s">camera_view and camera_projection hold mat4 matrices; the camera structures live in the scene.</text>
</svg>
