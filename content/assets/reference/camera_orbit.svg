<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 500" width="700" height="500">
  <style>
    text { font-family: Helvetica, Arial, sans-serif; font-size: 14px; fill: #666666; }
    .in { fill: #333; }
    .b { font-weight: bold; }
    .m { font-family: Menlo, Consolas, monospace; font-size: 13px; fill: #333; }
    .s { font-size: 13px; }
    .cpu { fill: #e3eefb; stroke: #6b9bd8; stroke-width: 1.5; }
    .card { fill: #ffffff; stroke: #cccccc; stroke-width: 1; }
    .sep { stroke: #c9d9ef; stroke-width: 1; }
    .ae { stroke: #4a86d0; stroke-width: 2; fill: none; marker-end: url(#ae); marker-start: url(#as); }
    .ap { stroke: #2a8f99; stroke-width: 2.2; fill: none; marker-end: url(#ap); }
    .ao { stroke: #e07b1a; stroke-width: 2.2; fill: none; marker-end: url(#ao); }
  </style>
  <defs>
    <marker id="ae" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4a86d0"/></marker>
    <marker id="as" viewBox="0 0 10 10" refX="1" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M10,0 L0,5 L10,10 z" fill="#4a86d0"/></marker>
    <marker id="ap" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#2a8f99"/></marker>
    <marker id="ao" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#e07b1a"/></marker>
  </defs>

  <text x="20" y="24" class="b" style="fill:#2b66ad">camera_orbit: a camera on a sphere around a center</text>

  <!-- drawing -->
  <rect x="20" y="36" width="380" height="260" rx="8" class="card"/>
  <path d="M308.6,211.5 A222,222 0 0 0 165.9,41.4" fill="none" stroke="#bbbbbb" stroke-width="1.2" stroke-dasharray="5 4"/>
  <line x1="90" y1="250" x2="270" y2="120" stroke="#bbbbbb" stroke-width="1" stroke-dasharray="3 3"/>
  <!-- distance dimension -->
  <path d="M101,263 L279,134" class="ae"/>
  <text x="0" y="0" class="m" transform="translate(206,215) rotate(-35.9)" text-anchor="middle" style="fill:#2b66ad">distance_to_center</text>
  <!-- camera frame -->
  <path d="M270,120 L313,89" class="ap"/>
  <path d="M270,120 L240,79" class="ap"/>
  <path d="M270,120 L215,160" class="ao"/>
  <text x="318" y="86" class="m" style="fill:#1a6b73">z</text>
  <text x="200" y="74" class="m" style="fill:#1a6b73">up()</text>
  <text x="172" y="148" class="m" style="fill:#a85000">front()</text>
  <circle cx="270" cy="120" r="6.5" fill="#333"/>
  <text x="284" y="136" class="m">position()</text>
  <circle cx="90" cy="250" r="6.5" fill="#e07b1a"/>
  <text x="40" y="276" class="m" style="fill:#a85000">center_of_rotation</text>
  <text x="208" y="284" class="s">right() points into the page</text>

  <!-- fields -->
  <rect x="412" y="36" width="268" height="260" rx="8" class="cpu"/>
  <text x="424" y="58" class="s b in">fields (default)</text>
  <text x="424" y="80" class="m" style="fill:#1a6b73">orientation_camera</text>
  <text x="572" y="80" class="s">identity</text>
  <text x="424" y="102" class="m" style="fill:#a85000">center_of_rotation</text>
  <text x="572" y="102" class="s">(0, 0, 0)</text>
  <text x="424" y="124" class="m" style="fill:#2b66ad">distance_to_center</text>
  <text x="572" y="124" class="s">5</text>
  <line x1="422" y1="138" x2="670" y2="138" class="sep"/>
  <text x="424" y="158" class="s b in">derived (methods)</text>
  <text x="424" y="180" class="m">position() =</text>
  <text x="436" y="198" class="m">orientation_camera</text>
  <text x="436" y="216" class="m">* (0,0,distance_to_center)</text>
  <text x="436" y="234" class="m">+ center_of_rotation</text>
  <text x="424" y="258" class="m">front()</text><text x="488" y="258" class="s">= -z axis, toward center</text>
  <text x="424" y="282" class="m">matrix_view()</text><text x="532" y="282" class="s">= inverse of frame</text>

  <!-- controller -->
  <text x="20" y="328" class="b" style="fill:#2b66ad">Mouse and keys (camera_controller_orbit)</text>
  <text x="24" y="354" class="s in">left drag</text>
  <text x="176" y="354" class="m">manipulator_rotate_arcball</text>
  <text x="480" y="354" class="s">orbit: orientation_camera</text>
  <text x="24" y="378" class="s in">right drag</text>
  <text x="176" y="378" class="m">manipulator_scale_distance_to_center</text>
  <text x="480" y="378" class="s">zoom: distance_to_center</text>
  <text x="24" y="402" class="s in">Ctrl + left drag</text>
  <text x="176" y="402" class="m">manipulator_translate_in_plane</text>
  <text x="480" y="402" class="s">pan: center in view plane</text>
  <text x="24" y="426" class="s in">Ctrl + right drag</text>
  <text x="176" y="426" class="m">manipulator_translate_front</text>
  <text x="480" y="426" class="s">center along front()</text>
  <text x="24" y="450" class="s in">left / right, R / F</text>
  <text x="176" y="450" class="m">manipulator_rotate_roll_pitch_yaw</text>
  <text x="480" y="450" class="s">roll around front()</text>
  <text x="20" y="484" class="s">look_at(eye, center, up) sets orientation_camera, center_of_rotation and distance_to_center</text>
</svg>
