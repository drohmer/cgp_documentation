<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 440" width="700" height="440">
  <style>
    text { font-family: Helvetica, Arial, sans-serif; font-size: 15px; fill: #555; }
    .t { fill: #333; }
    .lt { fill: #8a5a00; }
    .m { font-family: Menlo, Consolas, monospace; font-size: 13px; fill: #8a5a00; }
    .ray { stroke: #e0a030; stroke-width: 1.2; stroke-opacity: 0.55; fill: none; }
    .hray { stroke: #e0a030; stroke-width: 2.2; fill: none; }
    .box { stroke: #e0a030; stroke-width: 1.2; stroke-dasharray: 6 4; fill: #e0a030; fill-opacity: 0.06; }
  </style>
  <defs>
    <marker id="o" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#e0a030"/></marker>
  </defs>
  <!-- Side view of shadow mapping with a directional light: parallel rays inside the orthographic box of the light -->
  <polygon points="229.6,140.0 452.9,27.5 607.8,335.0 327.9,335.0" class="box"/>
  <line x1="229.6" y1="140.0" x2="452.9" y2="27.5" stroke="#e0a030" stroke-width="4"/>
  <rect x="20" y="335" width="660" height="8" fill="#888888" fill-opacity="0.6"/>
  <rect x="427.6" y="335" width="80.6" height="8" fill="#404040" fill-opacity="0.9"/>
  <line x1="251.9" y1="128.7" x2="355.9" y2="335.0" class="ray"/>
  <line x1="296.6" y1="106.2" x2="411.9" y2="335.0" class="ray"/>
  <line x1="385.9" y1="61.2" x2="523.9" y2="335.0" class="ray"/>
  <line x1="430.6" y1="38.7" x2="579.9" y2="335.0" class="ray"/>
  <circle cx="420.0" cy="240.0" r="36.0" fill="#e05050" fill-opacity="0.6" stroke="#888888"/>
  <line x1="352.5" y1="78.1" x2="416.1" y2="204.2" class="hray"/>
  <line x1="416.1" y1="204.2" x2="482.0" y2="335.0" class="hray" stroke-dasharray="5 5"/>
  <line x1="251.9" y1="128.7" x2="355.9" y2="335.0" class="hray"/>
  <circle cx="321.0" cy="43.5" r="11" fill="#e0a030"/>
  <line x1="326.8" y1="55.1" x2="337.6" y2="76.6" stroke="#e0a030" stroke-width="2" marker-end="url(#o)"/>
  <text x="301" y="49" class="lt" text-anchor="end">directional light</text>
  <text x="301" y="67" class="lt" text-anchor="end">(parallel rays)</text>
  <text x="477" y="43" class="m">view_light:</text>
  <text x="477" y="62" class="lt">frame of the light</text>
  <text x="20" y="190" class="lt">orthographic box</text>
  <text x="20" y="209" class="lt">of the light:</text>
  <text x="20" y="228" class="m">projection_orthographic</text>
  <text x="20" y="247" class="m">(-5,5,-5,5,0,20)</text>
  <g fill="#555">
    <circle cx="416.1" cy="204.2" r="4"/>
    <text x="356" y="200" class="t">A</text>
    <line x1="370.1" y1="196.2" x2="410.1" y2="203.2" stroke="#888888"/>
    <circle cx="482.0" cy="335.0" r="5"/>
    <text x="490" y="327" class="t">P</text>
    <circle cx="355.9" cy="335.0" r="5"/>
    <text x="364" y="327" class="t">Q</text>
  </g>
  <text x="20" y="378">Pass 1 (from the light): the shadow map stores the depth of A, the closest</text>
  <text x="20" y="398">surface along each ray of the light.</text>
  <text x="20" y="423">Pass 2 (from the camera): P is farther than A along its ray, in shadow; Q is lit.</text>
</svg>
