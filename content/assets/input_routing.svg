<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 430" width="760" height="430">
  <style>
    text { font-family: Helvetica, Arial, sans-serif; font-size: 14px; fill: #666666; }
    .in { fill: #333; font-size: 13px; }
    .m { font-family: Menlo, Consolas, monospace; font-size: 12px; fill: #333; }
    .mb { font-family: Menlo, Consolas, monospace; font-size: 12px; fill: #2b66ad; }
    .mo { font-family: Menlo, Consolas, monospace; font-size: 12px; fill: #c2185b; }
    .b { font-weight: bold; }
    .box { fill: #e3eefb; stroke: #6b9bd8; stroke-width: 1.2; }
    .obox { fill: #dff0dc; stroke: #5aa55a; stroke-width: 1.2; }
    .gbox { fill: #f2f2f2; stroke: #aaa; stroke-width: 1.2; }
    .ab { stroke: #4a86d0; stroke-width: 2; fill: none; marker-end: url(#ab); }
    .ag { stroke: #999; stroke-width: 1.5; fill: none; marker-end: url(#ag); }
  </style>
  <defs>
    <marker id="ab" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#4a86d0"/></marker>
    <marker id="ag" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto"><path d="M0,0 L10,5 L0,10 z" fill="#999"/></marker>
  </defs>

  <!-- Left: relative coordinates of the window -->
  <text x="20" y="28" class="b" style="fill:#2b66ad">Mouse position (relative coordinates)</text>
  <rect x="40" y="70" width="250" height="180" fill="#fff" stroke="#888" stroke-width="1.5"/>
  <line x1="40" y1="160" x2="290" y2="160" stroke="#ddd" stroke-dasharray="4 3"/>
  <line x1="165" y1="70" x2="165" y2="250" stroke="#ddd" stroke-dasharray="4 3"/>
  <text x="40" y="62" class="m" text-anchor="middle">(-1,1)</text>
  <text x="290" y="62" class="m" text-anchor="middle">(1,1)</text>
  <text x="40" y="268" class="m" text-anchor="middle">(-1,-1)</text>
  <text x="290" y="268" class="m" text-anchor="middle">(1,-1)</text>
  <text x="171" y="176" class="m">(0,0)</text>
  <circle cx="165" cy="160" r="3" fill="#888"/>
  <!-- GUI window -->
  <rect x="48" y="78" width="78" height="46" class="gbox"/>
  <text x="87" y="98" class="in" text-anchor="middle">GUI</text>
  <text x="87" y="115" class="m" text-anchor="middle">on_gui</text>
  <!-- cursor -->
  <circle cx="240" cy="110" r="5" fill="#d6407a"/>
  <text x="232" y="96" class="mo" text-anchor="middle">current</text>
  <circle cx="205" cy="135" r="4" fill="none" stroke="#d6407a" stroke-width="1.5"/>
  <text x="200" y="152" class="mo" text-anchor="middle">previous</text>
  <line x1="209" y1="132" x2="234" y2="114" class="ag" style="stroke:#d6407a"/>
  <text x="40" y="296" class="in">x: left to right, y: bottom to top,</text>
  <text x="40" y="314" class="in">whatever the size of the window.</text>
  <text x="40" y="340" class="m">inputs.mouse.position.current</text>
  <text x="40" y="358" class="m">inputs.mouse.position.previous</text>

  <!-- Right: routing of a mouse event -->
  <text x="370" y="28" class="b" style="fill:#2b66ad">Route of a mouse event</text>

  <rect x="370" y="44" width="370" height="40" rx="4" class="gbox"/>
  <text x="555" y="69" class="in" text-anchor="middle">GLFW: the mouse moves, a button changes, the wheel turns</text>
  <line x1="555" y1="84" x2="555" y2="104" class="ab"/>

  <rect x="370" y="106" width="370" height="58" rx="4" class="box"/>
  <text x="380" y="126" class="in b">application: updates inputs</text>
  <text x="380" y="145" class="m">mouse.position, mouse.click, mouse.scroll</text>
  <text x="380" y="159" class="m">mouse.on_gui = cursor over an ImGui window</text>
  <line x1="555" y1="164" x2="555" y2="184" class="ab"/>

  <rect x="370" y="186" width="200" height="40" rx="4" class="box"/>
  <text x="470" y="211" class="in b" text-anchor="middle">on_gui ?</text>
  <line x1="570" y1="206" x2="618" y2="206" class="ag"/>
  <text x="594" y="199" class="in" text-anchor="middle">yes</text>
  <rect x="620" y="186" width="120" height="40" rx="4" class="gbox"/>
  <text x="680" y="211" class="in" text-anchor="middle">ImGui only</text>
  <line x1="470" y1="226" x2="470" y2="250" class="ab"/>
  <text x="480" y="243" class="in">no</text>

  <rect x="370" y="252" width="370" height="58" rx="4" class="obox"/>
  <text x="380" y="272" class="in b">scene callback (your code)</text>
  <text x="380" y="291" class="m">mouse_move_event()  mouse_click_event()</text>
  <text x="380" y="305" class="m">mouse_scroll_event()</text>
  <line x1="555" y1="310" x2="555" y2="330" class="ab"/>

  <rect x="370" y="332" width="370" height="40" rx="4" class="box"/>
  <text x="380" y="357" class="m">camera_control.action_mouse_move() ...</text>

  <text x="370" y="398" class="in">Every frame, independently of the events:</text>
  <text x="370" y="414" class="m">idle_frame() -&gt; camera_control.idle_frame()</text>
</svg>
