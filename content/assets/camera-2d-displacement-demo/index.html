<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>CGP demo</title>
<style>
  html, body { margin: 0; padding: 0; height: 100%; overflow: hidden; background: #000; }
  #canvas { display: block; width: 100%; height: 100%; outline: none; }
  #status { position: absolute; left: 12px; top: 10px; color: #ccc; font: 13px sans-serif; }
</style>
</head>
<body>
<div id="status">Loading...</div>
<canvas id="canvas" oncontextmenu="event.preventDefault()" tabindex="-1"></canvas>
<script>
  var canvas = document.getElementById('canvas');
  function resize() {
    canvas.width = Math.floor(window.innerWidth * (window.devicePixelRatio || 1));
    canvas.height = Math.floor(window.innerHeight * (window.devicePixelRatio || 1));
  }
  resize();
  window.addEventListener('resize', resize);
  canvas.addEventListener('webglcontextlost', function (e) {
    document.getElementById('status').textContent = 'WebGL context lost: reload the page.';
    e.preventDefault();
  });
  var Module = {
    canvas: canvas,
    setStatus: function (text) { var s = document.getElementById('status'); if (s) s.textContent = text; },
    onRuntimeInitialized: function () { document.getElementById('status').remove(); canvas.focus(); }
  };
</script>
<script async src="project.js"></script>
</body>
</html>
