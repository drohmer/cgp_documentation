  <text x="340" y="90" class="in">25 samples, half a texel apart:</text>
  <text x="340" y="112" class="m">projCoords.xy + 0.5*vec2(x, y)*texelSize</text>
  <text x="340" y="134" class="m">x, y = -2 .. 2</text>
  <circle cx="346" cy="166" r="5" fill="#e07b1a"/><text x="360" y="171" class="in">depth of the pixel - bias &gt; depth stored: in shadow</text>
  <circle cx="346" cy="192" r="5" fill="#fff" stroke="#e07b1a" stroke-width="1.5"/><text x="360" y="197" class="in">lit</text>
  <text x="340" y="236" class="in">shadow = 10 / 25 = 0.40: the diffuse and specular</text>
  <text x="340" y="256" class="in">terms are multiplied by 1 - shadow. Near the border of</text>
  <text x="340" y="276" class="in">a shadow the fraction goes from 0 to 1 over about two</text>
  <text x="340" y="296" class="in">texels: a soft edge instead of a staircase.</text>
