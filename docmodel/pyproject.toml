[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "cgp-docmodel"
version = "0.1.0"
description = "Extract a documentation model (api.json) of the CGP C++ library from Doxygen XML"
requires-python = ">=3.10"
dependencies = ["pyyaml>=6", "jsonschema>=4.18"]

[project.optional-dependencies]
test = ["pytest>=8"]

[project.scripts]
cgp-docmodel = "cgp_docmodel.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: needs doxygen and the CGP sources (about 1 s)"]
addopts = "-ra"
