# Descriptions of the fields and methods of the documented types (Reference pages).
#
# Key: <struct>::<field> for a field (the struct that declares it, e.g. timer_basic::t),
# the method key for a method (as in api.json, e.g. timer_basic::start()).
# Value: one sentence, present tense, plain ASCII; end with " [draft]" if written without
# reading the C++ code. A Doxygen brief in the source is used when no entry exists here.

# --- B
'mesh::position': "Per-vertex 3D positions of the mesh, indexed by the triangles of connectivity."
'mesh::normal': "Per-vertex normals, expected to have the same size as position (filled by fill_empty_field or normal_update when empty)."
'mesh::color': "Per-vertex RGB colors in [0,1], set to white by fill_empty_field when missing."
'mesh::uv': "Per-vertex texture coordinates, set to (0,0) by fill_empty_field when missing."
'mesh::connectivity': "Triangles of the mesh, each given as a triplet of indices into the per-vertex arrays."
'mesh::flip_connectivity()': "Swaps the first two indices of every triangle to reverse its orientation, without modifying the stored normals, and returns the mesh."
'mesh::normal_update()': "Recomputes the per-vertex normals as the normalized sum of the unit normals of the adjacent non-degenerate triangles, and returns the mesh."
'mesh::translate(float,float,float)': "Adds the translation (tx,ty,tz) to every position, leaving the normals unchanged, and returns the mesh."
'mesh::apply_transform(affine const&)': "Applies the affine transform to every position, maps each normal by the rotation and the inverse of scaling_xyz (negated for a negative scaling) before renormalizing it, reverses the triangles of a reflection, and returns the mesh."
'mesh::apply_transform(affine_rt const&)': "Applies the rotation and translation to every position and the rotation to every normal, and returns the mesh."
'mesh::apply_transform(affine_rts const&)': "Applies the rotation, translation and uniform scaling to every position and the rotation to every normal; a negative scaling also negates the normals and reverses the triangles; returns the mesh."
'mesh_drawable::default_shader': "Static shader shared by all mesh_drawable and used by default in initialize_data_on_gpu, loaded from shaders/mesh/mesh.vert.glsl and mesh.frag.glsl by the application."
'mesh_drawable::default_texture': "Static 1x1 white RGBA texture shared by all mesh_drawable and used by default in initialize_data_on_gpu."
'mesh_drawable::shader': "Shader program used to draw this drawable, which must be valid (non-zero id) at draw time."
'mesh_drawable::texture': "Main texture bound to texture unit 0 and sent to the uniform image_texture at draw time."
'mesh_drawable::supplementary_texture': "Additional textures for multi-texturing, keyed by uniform name and bound to texture units 1, 2, ... in the order of the map at draw time."
'mesh_drawable::vbo_position': "VBO storing the vertex positions, bound to shader location 0."
'mesh_drawable::vbo_normal': "VBO storing the vertex normals, bound to shader location 1."
'mesh_drawable::vbo_color': "VBO storing the vertex colors, bound to shader location 2."
'mesh_drawable::vbo_uv': "VBO storing the vertex texture coordinates, bound to shader location 3."
'mesh_drawable::supplementary_vbo': "Optional extra VBOs (per-vertex or per-instance), where the element k is bound to shader location k+4."
'mesh_drawable::ebo_connectivity': "EBO storing the triangle indices used by the indexed draw call."
'mesh_drawable::vao': "OpenGL id of the Vertex Array Object describing the VBO layout, 0 when not initialized."
'mesh_drawable::model': "Model transform of the drawable (translation, rotation, scaling, scaling_xyz), reset to identity by initialize_data_on_gpu and clear."
'mesh_drawable::hierarchy_transform_model': "Global transform set by hierarchy_mesh_drawable::update_local_to_global_coordinates, applied first in the model matrix sent to the shader."
'mesh_drawable::supplementary_model_matrix': "Generic 4x4 matrix inserted between hierarchy_transform_model and model in the model matrix, identity by default and reset by initialize_data_on_gpu."
'mesh_drawable::material': "Phong material (color, alpha, shading coefficients, texture settings) sent to the uniform struct material at draw time."
'mesh_drawable::initialize_data_on_gpu(mesh const&,opengl_shader_structure const&,opengl_texture_image_structure const&)': "Checks the mesh with mesh_check, uploads its position, normal, color, uv and connectivity into new VBOs, an EBO and a VAO (locations 0 to 3), and resets model, material and supplementary_model_matrix, keeping a previously set shader or texture when the default one is passed."
'mesh_drawable::clear()': "Deletes the VBOs (including the supplementary ones), the EBO and the VAO, and resets shader, texture, supplementary_texture, model and material without deleting the shader program or the textures."
'mesh_drawable::send_opengl_uniform(bool) const': "Sends the uniform model = hierarchy_transform_model * supplementary_model_matrix * model and the material uniforms to the current shader."
'mesh_drawable::initialize_supplementary_data_on_gpu<T>(numarray<T> const&,GLuint,GLuint)': "Uploads an extra vec2, vec3 or vec4 array into supplementary_vbo and binds it in the VAO at location_index (which must be at least 4), with divisor greater than 0 for per-instance data."
'mesh_drawable::update_supplementary_data_on_gpu<T>(numarray<T> const&,GLuint,int)': "Overwrites the content of the supplementary VBO at location_index (at least 4, already initialized) without reallocation, sending only the first size_elements_update elements when it is not -1."
'curve_drawable::display_type': "Drawing mode, Curve (default) for a GL_LINE_STRIP joining all the points, or Segments for GL_LINES between consecutive pairs of points."
'curve_drawable::shader': "Shader program used to draw the curve, which must be valid (non-zero id) at draw time."
'curve_drawable::vbo_position': "VBO storing the positions of the curve points, bound to shader location 0."
'curve_drawable::vao': "OpenGL id of the Vertex Array Object of the curve, 0 when not initialized."
'curve_drawable::model': "Model transform sent to the uniform model, reset to identity by initialize_data_on_gpu and clear."
'curve_drawable::color': "Uniform RGB color of the curve sent to the uniform color, set to red by initialize_data_on_gpu."
'curve_drawable::default_shader': "Static shader shared by all curve_drawable and used by default in initialize_data_on_gpu, loaded from shaders/single_color by the application."
'curve_drawable::initialize_data_on_gpu(numarray<vec3> const&,opengl_shader_structure const&)': "Uploads the positions into a new VBO and VAO, sets the shader, and resets model to identity and color to red (does nothing but warn if position is empty)."
'curve_drawable::clear()': "Deletes the VBO and the VAO, sets the shader id to 0 without deleting the program, and resets model to identity and color to black."
'curve_drawable::send_opengl_uniform(bool) const': "Sends the uniforms color and model to the shader of the curve."
'image_structure::width': "Number of pixels in the horizontal direction."
'image_structure::height': "Number of pixels in the vertical direction."
'image_structure::color_type': "Pixel format of data, rgb (3 bytes per pixel) or rgba (4 bytes per pixel)."
'image_structure::data': "Pixel bytes in [0,255] stored row by row, the component c of pixel (x,y) being at index (x + width*y)*N + c with N = 3 or 4."
'image_structure::image_structure()': "Builds an empty RGB image of size 0x0."
'image_structure::image_structure(unsigned int,unsigned int,image_color_type,numarray<unsigned char> const&)': "Builds an image from its size, color type and pixel bytes, without checking that the size of the data matches."
'image_structure::subimage(int,int,int,int) const': "Returns a copy of the rectangle of pixels [start_h,end_h[ x [start_v,end_v[ of the image, end bounds excluded."
'image_structure::mirror_horizontal() const': "Returns a copy of the image with the pixel columns reversed (left-right mirror)."
'image_structure::mirror_vertical() const': "Returns a copy of the image with the pixel rows reversed (top-bottom mirror)."
'image_structure::rotate_90_degrees_counterclockwise() const': "Returns a copy of the image rotated by 90 degrees, with width and height swapped, where the output pixel (x,y) is the input pixel (width-1-y, x)."
'image_structure::rotate_90_degrees_clockwise() const': "Returns a copy of the image rotated by 90 degrees, with width and height swapped, where the output pixel (x,y) is the input pixel (y, height-1-x)."
'opengl_shader_structure::id': "OpenGL id of the shader program, 0 when no shader is loaded."
'opengl_shader_structure::load(std::string const&,std::string const&,bool)': "Compiles and links the vertex and fragment shader files into a new program and stores its id, stopping the program on a missing file or a compilation error and without deleting the previous program."
'opengl_shader_structure::load_from_inline_text(std::string const&,std::string const&,bool*)': "Compiles and links a program from the vertex and fragment source texts, sets id to 0 and load_shader_ok to false on failure instead of stopping, and does not delete the previous program."
'opengl_shader_structure::clear()': "Deletes the program, removes its entries from the uniform-location cache and sets id to 0, doing nothing when id is already 0."
'opengl_shader_structure::query_uniform_location(std::string const&) const': "Returns the location of a uniform in the program (-1 if absent), calling glGetUniformLocation only the first time and reading a cache shared by all shaders afterwards."
'opengl_shader_structure::clear_cache_uniform_location()': "Empties the uniform-location cache for every shader program, not only this one."
'opengl_shader_structure::debug_dump_cache_uniform_location()': "Returns a text listing every cached (program id, uniform name, location) entry, for debugging."
'opengl_texture_image_structure::id': "OpenGL id of the texture, 0 when no texture is allocated."
'opengl_texture_image_structure::width': "Width of the texture in pixels."
'opengl_texture_image_structure::height': "Height of the texture in pixels."
'opengl_texture_image_structure::format': "Internal format of the texture, such as GL_RGB8, GL_RGBA8, GL_RGB32F or GL_DEPTH_COMPONENT."
'opengl_texture_image_structure::texture_type': "Texture target, GL_TEXTURE_2D or GL_TEXTURE_CUBE_MAP, used by bind and unbind."
'opengl_texture_image_structure::bind() const': "Binds the texture to its target on the currently active texture unit, asserting that id is not 0."
'opengl_texture_image_structure::unbind() const': "Binds texture 0 to the target of this texture on the currently active texture unit."
'opengl_texture_image_structure::clear()': "Deletes the texture on the GPU and resets all fields to their default values, asserting that id is not 0."
'opengl_texture_image_structure::update_wrap(GLint,GLint) const': "Sets the wrap modes in s and t (GL_CLAMP_TO_EDGE, GL_REPEAT, GL_MIRRORED_REPEAT, ...) on the target of the texture (texture_type) after binding it."
'opengl_texture_image_structure::load_and_initialize_texture_2d_on_gpu(std::string const&,GLint,GLint,bool,GLint,GLint)': "Loads a PNG or JPG file with image_load_file and creates a GL_TEXTURE_2D from it, with clamp-to-edge wrapping and mipmaps by default."
'opengl_texture_image_structure::initialize_texture_2d_on_gpu(image_structure const&,GLint,GLint,bool,GLint,GLint)': "Creates a new GL_TEXTURE_2D in GL_RGB8 or GL_RGBA8 from the image, with clamp-to-edge wrapping and mipmaps by default, without deleting a previously allocated texture."
'opengl_texture_image_structure::initialize_texture_2d_on_gpu(grid_2D<vec3> const&,GLint,GLint,bool,GLint,GLint)': "Creates a new GL_TEXTURE_2D in GL_RGB32F from a grid of float RGB colors, with clamp-to-edge wrapping and mipmaps by default, without deleting a previously allocated texture."
'opengl_texture_image_structure::initialize_cubemap_on_gpu(image_structure const&,image_structure const&,image_structure const&,image_structure const&,image_structure const&,image_structure const&)': "Creates a GL_TEXTURE_CUBE_MAP from six square images of the same size and color type (faces -x, +x, -y, +y, -z, +z), with clamp-to-edge wrapping, linear filtering and no mipmap."
'opengl_texture_image_structure::initialize_texture_2d_on_gpu(int,int,GLint,GLenum,GLint,GLint,GLint,GLint)': "Allocates an uninitialized texture of the given size, format and target without mipmap, typically used as a render target."
'opengl_texture_image_structure::update(grid_2D<vec3> const&)': "Overwrites the texture pixels with the grid content using glTexSubImage2D, read with the component type of the current format, and regenerates the mipmaps."
'opengl_texture_image_structure::update(image_structure const&)': "Overwrites the texture pixels with the image content using glTexSubImage2D, read with the component type of the current format, and regenerates the mipmaps."
