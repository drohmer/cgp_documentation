# --- Rewrites of descriptions copied from the C++ comments (2026-10-29, checked against the bodies)
'check_file_exist(std::string const&)': "Returns true if the file can be opened for reading, false otherwise."
'check_path_exist(std::string const&)': "Returns true if a file or directory exists at the given path, false otherwise."
'is_equal<T1,T2>(grid_2D<T1> const&,grid_2D<T2> const&)': "Returns true if both grids have the same dimension and equal elements (approximate comparison for floating-point values)."
'marching_cube(grid_3D<float> const&,spatial_domain_grid_3D const&,float)': "Extracts the iso-surface of value iso of a field sampled on the grid domain (same dimension) as a new mesh whose triangles share their vertices, with normals computed by fill_empty_field."
'mesh_primitive_disc(float,vec3 const&,vec3 const&,int)': "Disc of the given radius centered at center and orthogonal to normal, made of N vertices on the circle linked to a central vertex, with a constant normal and uv mapping the disc into the unit square."
'mesh_primitive_frame(frame const&,float,vec3 const&,vec3 const&,vec3 const&,vec3 const&,float)': "Mesh of the frame f: three arrows of length scale along ux, uy and uz (red, green and blue by default) and a sphere at its origin, the arrow radius being frame_thickness*scale."
'mesh_primitive_quadrangle(vec3 const&,vec3 const&,vec3 const&,vec3 const&)': "Quadrangle through the corners p00, p10, p11, p01, made of the triangles (p00,p10,p11) and (p00,p11,p01), with uv (0,0), (1,0), (1,1), (0,1) at the corners."
'mesh_primitive_sphere(float,vec3 const&,int,int)': "Sphere of the given radius and center sampled in spherical coordinates, Nu samples around the z axis and Nv from the south to the north pole, closed at the poles, with normals and uv."
'obj_read_connectivity(std::string const&)': "Reads the first three vertex indices of every face (f line) of an .obj file as a 0-based triangle, ignoring the texture and normal indices."
'obj_read_positions(std::string const&)': "Reads the vertex positions (v lines) of an .obj file."
'obj_read_texture_uv(std::string const&)': "Reads the texture coordinates (vt lines, u and v) of an .obj file."
'operator<<<T,N>(std::ostream&,numarray_stack<T,N> const&)': "Writes the components of the vector to the stream, separated by spaces."
'operator<<<T,N1,N2>(std::ostream&,grid_stack_2D<T,N1,N2> const&)': "Writes all elements of the grid to the stream, in storage order separated by spaces."
'operator<<<T,N1,N2>(std::ostream&,matrix_stack<T,N1,N2> const&)': "Writes all coefficients of the matrix to the stream, row by row separated by spaces."
'operator<<<T>(std::ostream&,grid_2D<T> const&)': "Writes all elements of the grid to the stream, in storage order separated by spaces."
'operator<<<T>(std::ostream&,numarray<T> const&)': "Writes all elements of the array to the stream, separated by spaces."
'picking_mesh_vertex_as_sphere(vec2 const&,numarray<vec3> const&,numarray<vec3> const&,float,camera_generic_base const&,camera_projection_perspective const&)': "Casts the camera ray through the screen position and returns the closest vertex whose sphere of radius picking_distance it hits, with the hit point, the vertex normal and the vertex index (active is false if none)."
'picking_plane_orthogonal_to_camera(vec2 const&,vec3 const&,camera_generic_base const&,camera_projection_perspective const&)': "Intersects the camera ray through the screen position (relative coordinates) with the plane through plane_position orthogonal to the front direction of the camera."
'read_from_file_binary(std::string const&)': "Reads the whole file as a vector of bytes, stopping with an error if the file cannot be accessed or is empty."
'rotation_around_center(rotation_transform const&,vec3 const&)': "Rigid transform that applies the rotation R around center instead of the origin, mapping p to R(p - center) + center."
'str<T,N>(numarray_stack<T,N> const&,std::string const&,std::string const&,std::string const&)': "Text representation of the components, joined by separator and surrounded by begin and end."
'str<T,N1,N2>(grid_stack_2D<T,N1,N2> const&,std::string const&,std::string const&,std::string const&)': "Text representation of all elements in storage order, joined by separator and surrounded by begin and end."
'str<T,N1,N2>(matrix_stack<T,N1,N2> const&,std::string const&,std::string const&,std::string const&,std::string const&,std::string const&)': "Text representation of the matrix row by row, each row wrapped by begin_line and end_line with its values joined by separator, the whole surrounded by begin and end."
'str<T>(grid_2D<T> const&,std::string const&,std::string const&,std::string const&)': "Text representation of all elements in storage order, joined by separator and surrounded by begin and end."
'str<T>(numarray<T> const&,std::string const&,std::string const&,std::string const&)': "Text representation of the elements, joined by separator and surrounded by begin and end."
