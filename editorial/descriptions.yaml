operator*(affine const&,affine_rt const&): Composition T1 o T2 of an affine transform with a rigid transform, returned as an affine; asserts that T1.scaling_xyz is uniform (use T1.matrix()*T2.matrix() otherwise).
operator*(affine const&,affine_rts const&): Composition T1 o T2 of an affine transform with a rotation-translation-scaling, returned as an affine; asserts that T1.scaling_xyz is uniform (use T1.matrix()*T2.matrix() otherwise).
operator*(affine_rt const&,affine const&): Composition T1 o T2 of a rigid transform (parent) with an affine transform (child), exact for any scaling_xyz.
operator*(affine_rts const&,affine const&): Composition T1 o T2 of a rotation-translation-scaling (parent) with an affine transform (child), exact for any scaling_xyz.
operator*(affine const&,mat3 const&): Product of the 4x4 matrix of the affine transform with a mat3 extended to a mat4.
operator*(affine const&,mat4 const&): Product of the 4x4 matrix of the affine transform with a mat4.
operator*(affine const&,vec3 const&): 'Apply the affine transform to a point: rotation * (scaling * scaling_xyz * p) + translation (scaling_xyz stretches the local axes).'
operator*(affine const&,vec4 const&): "Apply the affine transform to a homogeneous vector, the translation being weighted by w: a direction (w=0) is not translated."
operator*(affine_rt const&,affine_rt const&): Composition T1 o T2 of two rigid transforms.
operator*(affine_rt const&,affine_rts const&): Composition T1 o T2 of a rigid transform with a rotation-translation-scaling.
operator*(affine_rt const&,float): Uniform scaling by s applied after the rigid transform (rotation kept, translation and scaling multiplied by s).
operator*(affine_rt const&,frame const&): 'Frame transformed by the rigid transform: orientation and position are rotated, then the position is translated.'
operator*(affine_rt const&,mat3 const&): Product of the 4x4 matrix of the rigid transform with a mat3 extended to a mat4.
operator*(affine_rt const&,mat4 const&): Product of the 4x4 matrix of the rigid transform with a mat4.
operator*(affine_rt const&,rotation_transform const&): 'Rigid transform T o R: the rotation is applied before T.'
operator*(affine_rt const&,vec3 const&): 'Apply the rigid transform to a point: rotation * p + translation.'
operator*(affine_rt const&,vec4 const&): Apply the rigid transform to a homogeneous vector, the translation being weighted by w.
operator*(affine_rts const&,affine_rt const&): Composition T1 o T2 of a rotation-translation-scaling with a rigid transform.
operator*(affine_rts const&,affine_rts const&): Composition T1 o T2 of two rotation-translation-scaling transforms.
operator*(affine_rts const&,float): Copy of the transform with its scaling multiplied by s, the translation being left unchanged.
operator*(affine_rts const&,mat3 const&): Product of the 4x4 matrix of the transform with a mat3 extended to a mat4.
operator*(affine_rts const&,mat4 const&): Product of the 4x4 matrix of the transform with a mat4.
operator*(affine_rts const&,rotation_transform const&): 'Transform T o R: the rotation is applied before T.'
operator*(affine_rts const&,vec3 const&): 'Apply the transform to a point: scaling * (rotation * p) + translation.'
operator*(affine_rts const&,vec4 const&): Apply the transform to a homogeneous vector, the translation being weighted by w.
operator*(float,affine_rt const&): Uniform scaling by s applied after the rigid transform (rotation kept, translation and scaling multiplied by s).
operator*(float,affine_rts const&): Copy of the transform with its scaling multiplied by s, the translation being left unchanged.
operator*(float,mat4 const&): 4x4 matrix scaled by a scalar.
operator*(float,quaternion const&): Quaternion with each component multiplied by a scalar.
operator*(float,rotation_transform const&): Rotation-translation-scaling transform made of the rotation r scaled by s, with zero translation.
operator*(mat3 const&,affine const&): Product of a mat3 extended to a mat4 with the 4x4 matrix of the affine transform.
operator*(mat3 const&,affine_rt const&): Product of a mat3 extended to a mat4 with the 4x4 matrix of the rigid transform.
operator*(mat3 const&,affine_rts const&): Product of a mat3 extended to a mat4 with the 4x4 matrix of the transform.
operator*(mat4 const&,affine const&): Product of a mat4 with the 4x4 matrix of the affine transform.
operator*(mat4 const&,affine_rt const&): Product of a mat4 with the 4x4 matrix of the rigid transform.
operator*(mat4 const&,affine_rts const&): Product of a mat4 with the 4x4 matrix of the transform.
operator*(mat4 const&,mat4 const&): Matrix product of two 4x4 matrices.
operator*(quaternion const&,float): Quaternion with each component multiplied by a scalar.
operator*(quaternion const&,quaternion const&): Quaternion (Hamilton) product, with the scalar part stored in w.
operator*(rotation_transform const&,affine_rt const&): 'Rigid transform R o T: the rotation is applied after T, rotating its translation as well.'
operator*(rotation_transform const&,affine_rts const&): 'Transform R o T: the rotation is applied after T, rotating its translation as well.'
operator*(rotation_transform const&,float): Rotation-translation-scaling transform made of the rotation r scaled by s, with zero translation.
