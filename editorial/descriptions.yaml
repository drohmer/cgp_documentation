project_path_find(std::string const&,std::string const&): Relative path to the project root that contains directory_to_find (shaders/ by default), searched from the current and executable directories; exits the program if not found.
projection_orthographic(float,float,float,float,float,float): OpenGL orthographic projection matrix mapping the box [left,right] x [bottom,top] x [-z_near,-z_far] to the unit cube.
