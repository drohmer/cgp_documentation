# One-line description per function, keyed by full signature key (see api.json 'key').
# Overrides the Doxygen brief from the C++ comments. Hand-curated, or written by an agent
# after reading the C++ body (2026-10-28); a description not checked against the code ends
# with ' [draft]'.
abs(char): Absolute value of a signed char.
abs(double): Absolute value of a double (std::abs).
abs(float): Absolute value of a float (std::abs).
abs(int): Absolute value of a signed int.
abs(long long): Absolute value of a signed long long.
abs(long): Absolute value of a signed long.
abs(short): Absolute value of a signed short.
abs(unsigned char): Absolute value of an unsigned integer, i.e. the value itself.
abs(unsigned int): Absolute value of an unsigned integer, i.e. the value itself.
abs(unsigned long long): Absolute value of an unsigned integer, i.e. the value itself.
abs(unsigned long): Absolute value of an unsigned integer, i.e. the value itself.
abs(unsigned short): Absolute value of an unsigned integer, i.e. the value itself.
abs<T,N>(numarray_stack<T,N> const&): Component-wise absolute value.
add<T,N>(T const&,numarray_stack<T,N> const&): Add a scalar to each component.
add<T,N>(numarray_stack<T,N> const&,T const&): Add a scalar to each component.
add<T>(T const&,numarray<T> const&): Array with a value added to each element.
add<T>(numarray<T> const&,T const&): Array with a value added to each element.
assert_file_exist(std::string const&): Raises an error, with hints on the working directory, if the file cannot be opened.
average<T,N>(numarray_stack<T,N> const&): Mean of the components.
average<T>(numarray<T> const&): Mean of the elements.
call_error(std::string const&,std::string const&,std::string const&,std::string const&,int): Reports an error with its location and failed condition, then aborts (or throws std::logic_error if CGP_ERROR_EXCEPTION is defined); called by the assert_cgp and error_cgp macros.
call_warning(std::string const&,std::string const&,std::string const&,std::string const&,int): Prints a warning with its location, at most cgp_warning::max_warning times per message id; called by the warning_cgp macro.
camera_frame_look_at(vec3 const&,vec3 const&,vec3 const&): Camera frame placed at eye and looking toward center (local -z axis), with its y axis aligned as much as possible with up.
camera_ray_direction(mat4 const&,mat4 const&,vec2 const&): Unit world-space direction of the ray through a screen position given in normalized device coordinates [-1,1]^2, from the camera frame and the inverse projection matrix.
check_index_bounds<T,N,INDEX_TYPE>(INDEX_TYPE,numarray_stack<T,2> const&): Raises an error if the index is outside [0, 1]; no-op when CGP_NO_DEBUG is defined.
check_index_bounds<T,N,INDEX_TYPE>(INDEX_TYPE,numarray_stack<T,3> const&): Raises an error if the index is outside [0, 2]; no-op when CGP_NO_DEBUG is defined.
check_index_bounds<T,N,INDEX_TYPE>(INDEX_TYPE,numarray_stack<T,4> const&): Raises an error if the index is outside [0, 3]; no-op when CGP_NO_DEBUG is defined.
check_index_bounds<T,N,INDEX_TYPE>(INDEX_TYPE,numarray_stack<T,N> const&): Raises an error if the index is outside [0, N-1]; no-op when CGP_NO_DEBUG is defined.
check_index_bounds<T,N1,N2>(int,int,grid_stack_2D<T,N1,N2> const&): Raises an error if (x,y) is outside [0,N1-1]x[0,N2-1]; no-op when CGP_NO_DEBUG is defined.
check_index_bounds<T,N1,N2>(int,int,matrix_stack<T,N1,N2> const&): Raises an error if (row,column) is outside [0,N1-1]x[0,N2-1]; no-op when CGP_NO_DEBUG is defined.
check_index_bounds<T,N1,N2>(int,matrix_stack<T,N1,N2> const&): Raises an error if the row index is outside [0,N1-1]; no-op when CGP_NO_DEBUG is defined.
check_index_bounds<T>(int,int,grid_2D<T> const&): Raises an error if (x,y) is outside the grid dimensions; no-op when CGP_NO_DEBUG is defined.
check_index_bounds<T>(int,int,int,grid_3D<T> const&): Raises an error if (x,y,z) is outside the grid dimensions; no-op when CGP_NO_DEBUG is defined.
check_index_bounds<T>(int,numarray<T> const&): Raises an error if the index is outside [0, size-1]; no-op when CGP_NO_DEBUG is defined.
check_offset_bounds<T,N1,N2>(int,matrix_stack<T,N1,N2> const&): Raises an error if the offset is outside [0,N1*N2-1]; no-op when CGP_NO_DEBUG is defined.
check_opengl_error(std::string const&,std::string const&,int): Drain the OpenGL error queue and raise a CGP error with the file, function and line if any error was pending; used by the opengl_check macro.
clamp<T,N>(numarray_stack<T,N> const&,numarray_stack<T,N> const&,numarray_stack<T,N> const&): Component-wise clamp between a min and max vector.
clamp<T1,T2>(T1,T2,T2): Clamps x to the interval [x_min, x_max].
conjugate(quaternion const&): Quaternion conjugate (= inverse for a unit quaternion).
connectivity_one_ring(numarray<uint3> const&,int): For each vertex, sorted indices of the vertices sharing a triangle with it (one-ring neighborhood).
contains<T1,T2>(std::map<T1,T2> const&,T1 const&): Checks whether a key exists in the map.
contains<T>(std::map<std::string,T> const&,char const*): Checks whether a C-string key exists in a map with string keys.
convert(image_structure const&,grid_2D<vec3>&): Convert an RGB or RGBA image into a grid_2D of vec3 colors in [0,1], dropping the alpha channel.
cross(vec3 const&,vec3 const&): Cross product (vec3 only).
currently_unused<T>(T const&): No-op that marks a variable as intentionally unused to silence compiler warnings.
curve_primitive_circle(float,vec3 const&,vec3 const&,int): Closed circle polyline of the given radius and center in the plane orthogonal to the unit normal, the last sample repeating the first one.
curve_to_segments(numarray<vec3> const&): Convert a polyline (p0,p1,...,pn) into a list of segment endpoints (p0,p1, p1,p2, ..., pn-1,pn).
det(mat2 const&): Determinant of a 2x2 matrix.
det(mat3 const&): Determinant of a 3x3 matrix.
det(mat4 const&): Determinant of a 4x4 matrix, by cofactor expansion along the last row.
div<T,N>(T const&,numarray_stack<T,N> const&): Scalar divided by each component.
div<T,N>(numarray_stack<T,N> const&,T const&): Divide each component by a scalar.
div<T,N>(numarray_stack<T,N> const&,T): Divide each component by a scalar.
div<T>(T const&,numarray<T> const&): Array of a value divided by each element.
div<T>(numarray<T> const&,T const&): Array with each element divided by a value.
dot<T,N>(numarray_stack<T,N> const&,numarray_stack<T,N> const&): Dot (scalar) product of two vectors.
draw(curve_drawable const&,environment_generic_structure const&,int): Draw a curve_drawable as a line strip or as separate segments, limited to the first N_points points if N_points is not -1.
draw(curve_drawable_dynamic_extend const&,environment_generic_structure const&): Draw the N_valid_points points currently stored in a curve_drawable_dynamic_extend.
draw(hierarchy_mesh_drawable const&,environment_generic_structure const&,int,bool,uniform_generic_structure const&): Draw every node of the hierarchy with draw(mesh_drawable); call update_local_to_global_coordinates() beforehand.
"draw(mesh_drawable const&,environment_generic_structure const&,int,bool,uniform_generic_structure const&,GLenum,material_mesh_drawable_phong const*)": Draw a mesh_drawable with its shader, textures, model and material, plus the environment and optional additional uniforms, possibly instanced or with an overriding material.
draw(skybox_drawable const&,environment_generic_structure const&): Draw the skybox; call it first with depth writing disabled (glDepthMask(GL_FALSE)).
draw(trajectory_drawable const&,environment_generic_structure const&): Draw the recorded positions of a trajectory_drawable as a polyline, if any.
"draw(triangles_drawable const&,environment_generic_structure const&,uniform_generic_structure const&,material_mesh_drawable_phong const*)": Draw a non-indexed triangles_drawable (triangle soup) with its shader, texture, model and material, plus the environment and optional additional uniforms.
"draw_wireframe(hierarchy_mesh_drawable const&,environment_generic_structure const&,vec3 const&,int,bool,uniform_generic_structure const&)": Draw the triangle edges of every node of the hierarchy in a flat color (no effect with Emscripten/WebGL).
"draw_wireframe(mesh_drawable const&,environment_generic_structure const&,vec3 const&,int,bool,uniform_generic_structure const&)": Draw the triangle edges of a mesh_drawable in a flat color, slightly offset toward the camera (no effect with Emscripten/WebGL).
"draw_wireframe(triangles_drawable const&,environment_generic_structure const&,vec3 const&,uniform_generic_structure const&)": Draw the triangle edges of a triangles_drawable in a flat color, slightly offset toward the camera (no effect with Emscripten/WebGL).
element<idx1,idx2,T,N1,N2>(grid_stack_2D<T,N1,N2> const&): Element (idx1,idx2) with indices checked at compile time (static_assert).
emscripten_set_glfw_window_hint(): Set the GLFW window hints for an OpenGL ES 3.0 context when compiled with Emscripten, do nothing otherwise.
emscripten_update_window_size(int&,int&): Set width and height to the HTML canvas size when compiled with Emscripten, do nothing otherwise.
file_get_size(std::string const&): Size of a file in bytes; the file must exist (error otherwise).
get<idx,T,N>(numarray_stack<T,N> const&): Component idx with the index checked at compile time (static_assert).
get<idx,T>(numarray_stack<T,2> const&): Component idx with the index checked at compile time (static_assert).
get<idx,T>(numarray_stack<T,3> const&): Component idx with the index checked at compile time (static_assert).
get<idx,T>(numarray_stack<T,4> const&): Component idx with the index checked at compile time (static_assert).
get<idx1,T,N1,N2>(matrix_stack<T,N1,N2> const&): Row idx1 as a vector, with the index checked at compile time (static_assert).
get<idx1,idx2,T,N1,N2>(matrix_stack<T,N1,N2> const&): Coefficient (idx1,idx2) with indices checked at compile time (static_assert).
get_offset<offset,T,N1,N2>(matrix_stack<T,N1,N2> const&): Coefficient at a row-major offset, with the offset checked at compile time (static_assert).
image_load_file(std::string const&): Load an image file, choosing the PNG (RGBA) or JPEG (RGB) reader from the extension .png, .jpg or .jpeg, in any case.
image_load_jpg(std::string const&): Load a JPEG file into an RGB image_structure.
image_load_png(std::string const&,image_color_type): Load a PNG file into an image_structure, converted to RGBA by default or to RGB; exits the program on decoding error.
image_save_jpg(std::string const&,image_structure const&): Save an RGB or RGBA image_structure as a JPEG file (the alpha channel is dropped).
image_save_png(std::string const&,image_structure const&): Save an RGB or RGBA image_structure as a PNG file; exits the program on encoding error.
image_split_grid(image_structure const&,int,int): Split an image into N_horizontal x N_vertical equal sub-images, stored column by column (index k_vertical + N_vertical*k_horizontal); aborts if the size is not divisible.
imgui_cleanup(): Shut down the ImGui OpenGL3 and GLFW backends and destroy the ImGui context.
imgui_create_frame(): Start a new ImGui frame; call before any ImGui widget of the current frame.
imgui_init(GLFWwindow*): Create the ImGui context and initialize its GLFW and OpenGL3 backends for the window (GLSL 150, or 300 es with Emscripten).
imgui_render_frame(GLFWwindow*): Render the ImGui widgets of the current frame with OpenGL.
index_grid_from_offset(int,int): Index (k1,k2) of a linear offset in a 2D grid of first dimension N1 (inverse of offset_grid).
index_grid_from_offset(int,int,int): Index (k1,k2,k3) of a linear offset in a 3D grid of dimensions N1 x N2 (inverse of offset_grid).
index_grid_from_offset_stack<N1>(int): Index pair (k1,k2) of a linear offset in a 2D grid whose first dimension N1 is known at compile time.
index_out_of_bounds_message(long long,long long,std::string const&,std::string const&): Builds the standard out-of-bounds error message for one axis, with a hint for negative indices, empty containers and too-large indices.
interpolation_bilinear<T>(grid_2D<T> const&,float,float): Bilinear interpolation of a grid_2D at continuous index coordinates (x,y), each in [0, dimension-1).
interpolation_linear<T>(float,T const&,T const&): Linear interpolation (1-alpha)*value_0 + alpha*value_1, with alpha expected in [0,1].
intersection_ray_plane(vec3 const&,vec3 const&,vec3 const&,vec3 const&): Intersection in front of the origin of a ray with a plane given by a point and a normal, invalid if the ray is parallel to the plane.
intersection_ray_sphere(vec3 const&,vec3 const&,vec3 const&,float): First intersection in front of the origin of a ray (unit direction expected) with a sphere, with its position and outward normal.
intersection_ray_spheres_closest(vec3 const&,vec3 const&,numarray<vec3> const&,float,int*): Closest intersection of a ray with a set of spheres of common radius, the index of the hit sphere (or -1) being written to shape_index if given.
inverse(affine_rt const&): Inverse rigid transform (rotation + translation).
inverse(affine_rts const&): Inverse affine transform.
inverse(frame const&): Frame of the inverse rigid transform (inverse orientation, position -R^-1 * position).
inverse(mat2 const&): Matrix inverse.
inverse(mat3 const&): Matrix inverse.
inverse(mat4 const&): Matrix inverse.
inverse(quaternion const&): Quaternion inverse.
inverse(rotation_transform const&): Inverse rotation.
is_equal(char const*,std::string const&): Exact equality of a C-string and a string.
is_equal(double,double): 'Approximate equality of two doubles: true if |a-b| <= 1e-7.'
is_equal(double,float): Approximate equality of a double and a float, compared in float precision with tolerance 1e-5.
is_equal(float,double): Approximate equality of a float and a double, compared in float precision with tolerance 1e-5.
is_equal(float,float): 'Approximate equality of two floats: true if |a-b| <= 1e-5.'
is_equal(std::string const&,char const*): Exact equality of a string and a C-string.
is_equal(std::string const&,std::string const&): Exact equality of two strings.
is_equal<T,N>(numarray_stack<T,N> const&,numarray_stack<T,N> const&): Component-wise equality of two fixed-size vectors, approximate for floating-point values.
is_equal<T1,T2,N1,N2>(numarray_stack<T1,N1> const&,numarray_stack<T2,N2> const&): Component-wise equality of two fixed-size vectors, approximate for floating-point values; false if sizes differ.
is_equal<T1,T2,N>(std::array<T1,N> const&,std::array<T2,N> const&): Element-wise equality of two std::array, approximate for floating-point elements.
is_equal<T1,T2>(T1 const&,T2 const&): Generic fallback equality test using operator== (exact comparison).
is_equal<T1,T2>(grid_3D<T1> const&,grid_3D<T2> const&): 'Equality of two 3D grids: same dimensions and element-wise equal values (approximate for floating-point).'
is_equal<T1,T2>(numarray<T1> const&,numarray<T2> const&): Element-wise equality of two arrays of possibly different element types (e.g. float and int); false if sizes differ.
is_equal<T1,T2>(std::vector<T1> const&,std::vector<T2> const&): Element-wise equality of two std::vector, approximate for floating-point elements; false if sizes differ.
is_equal<T>(numarray<T> const&,numarray<T> const&): Element-wise equality of two arrays, approximate for floating-point elements; false if sizes differ.
is_equal<Ta,Tb,Na1,Na2,Nb1,Nb2>(grid_stack_2D<Ta,Na1,Na2> const&,grid_stack_2D<Tb,Nb1,Nb2> const&): 'Equality of two fixed-size grids: same dimensions and element-wise equal values (approximate for floating-point).'
is_equal<Ta,Tb,Na1,Na2,Nb1,Nb2>(matrix_stack<Ta,Na1,Na2> const&,matrix_stack<Tb,Nb1,Nb2> const&): 'Equality of two matrices: same dimensions and coefficient-wise equal values (approximate for floating-point).'
"marching_cube(std::vector<vec3>&,std::vector<float> const&,spatial_domain_grid_3D const&,float,std::vector<marching_cube_relative_coordinates>*)": Fast marching cube writing a triangle soup into a reused position buffer and returning the number of valid vertices, optionally with the grid edge of each vertex.
marching_cube_lut_edgeTable(): Marching-cube table giving, for each of the 256 inside/outside corner configurations, the bit mask of the intersected edges (Paul Bourke).
marching_cube_lut_edge_order(): Pairs of corner indices defining the twelve edges of a marching-cube voxel.
marching_cube_lut_offset_cube(): Integer offsets of the eight corners of a marching-cube voxel, in the corner order of marching_cube_lut_edge_order.
marching_cube_lut_triTable(): Marching-cube table giving, for each of the 256 corner configurations, the list of edge triplets forming triangles, terminated by -1 (Paul Bourke).
max<T,N>(numarray_stack<T,N> const&): Largest component.
max<T>(numarray<T> const&): Largest element.
mesh_check(mesh const&): Check buffer sizes and triangle indices of a mesh, printing a warning for each problem found (including zero-length edges and unused vertices), and return false if a buffer or index is invalid.
mesh_load_file_obj(std::string const&): Load a single mesh from an .obj file, triangulating polygons and duplicating vertices where uv or normals differ (.mtl files are ignored).
mesh_load_file_obj(std::string const&,numarray<numarray<int>>&): Load a mesh from an .obj file like mesh_load_file_obj, also returning for each file vertex the indices of the mesh vertices created from it (empty fields are not filled).
mesh_load_file_obj_advanced(std::string const&,std::string const&): Load an .obj file with its .mtl materials using tinyobjloader, returning one mesh per material change, each paired with its diffuse texture uploaded to the GPU.
mesh_primitive_arrow(vec3 const&,vec3 const&,float,float,float,int): Arrow mesh from p0 to p1 made of a cylinder and a cone tip ending at p1, the cone length and radius being multiples of cylinder_radius (4 and 2.5 by default).
mesh_primitive_cone(float,float,vec3 const&,vec3 const&,bool,int,int): Cone mesh of base radius and height, with its base centered at center_of_base and pointing along the unit axis_direction, its base capped by a disc by default; Nu samples around the axis and Nv along the height.
mesh_primitive_cube(vec3 const&,float): Axis-aligned cube mesh of the given center and edge length, made of six independent two-triangle faces with flat normals.
"mesh_primitive_cubic_grid(vec3 const&,vec3 const&,vec3 const&,vec3 const&,vec3 const&,vec3 const&,vec3 const&,vec3 const&,int,int,int)": Hexahedron mesh given by its eight corners, each of its six faces sampled as a regular grid (Nx, Ny, Nz samples along each direction).
mesh_primitive_cylinder(float,vec3 const&,vec3 const&,int,int,bool): Cylinder mesh of the given radius around the axis [p0,p1], open by default or capped by two discs if is_closed is true, with normals and uv; Nu samples along the axis and Nv around it.
mesh_primitive_ellipsoid(vec3,vec3 const&,int,int): Ellipsoid mesh with semi-axes scale.x, scale.y, scale.z centered at center, with normals and uv.
mesh_primitive_grid(vec3 const&,vec3 const&,vec3 const&,vec3 const&,int,int): Bilinear patch through the four corners p00, p10, p11, p01, sampled as an Nu x Nv grid, with normals and uv; sample (ku,kv) has index kv + Nv*ku and uv (ku/(Nu-1), kv/(Nv-1)).
mesh_primitive_tetrahedron(vec3 const&,vec3 const&,vec3 const&,vec3 const&): Tetrahedron mesh given by its four corners, made of four independent triangles with flat normals.
mesh_primitive_torus(float,float,vec3 const&,vec3 const&,int,int): Torus mesh of major radius r_max and minor radius r_min, centered at center around the unit axis axis_orientation, with normals and uv.
mesh_primitive_triangle(vec3 const&,vec3 const&,vec3 const&): Single-triangle mesh (p0,p1,p2) with a flat normal.
mesh_save_file_obj(std::string const&,mesh const&): Save a mesh as an .obj file with its positions, uv and normals (per-vertex colors are not stored).
mesh_save_file_obj(std::string const&,std::vector<vec3> const&,std::vector<vec3> const&): Save a triangle soup (three consecutive positions per triangle) and its normals as an .obj file.
min<T,N>(numarray_stack<T,N> const&): Smallest component.
min<T>(numarray<T> const&): Smallest element.
mul<T,N>(T const&,numarray_stack<T,N> const&): Multiply each component by a scalar.
mul<T,N>(numarray_stack<T,N> const&,T const&): Multiply each component by a scalar.
mul<T,N>(numarray_stack<T,N> const&,numarray_stack<T,N> const&): Component-wise (Hadamard) product.
mul<T>(T const&,numarray<T> const&): Array with each element multiplied by a value.
mul<T>(numarray<T> const&,T const&): Array with each element multiplied by a value.
multiply_componentwise<T,N1,N2>(matrix_stack<T,N1,N2> const&,matrix_stack<T,N1,N2> const&): Coefficient-wise (Hadamard) product of two matrices of the same size.
multiply_matrix<T,N1,N2,N3>(grid_stack_2D<T,N1,N2> const&,grid_stack_2D<T,N2,N3> const&): Matrix product of an N1xN2 grid and an N2xN3 grid, giving an N1xN3 grid.
noise_perlin(float,int,float,float): Fractal 1D noise in [0,1] summing octave layers of simplex noise, each layer scaled in amplitude by persistency and in frequency by frequency_gain (defaults 5, 0.3, 2).
noise_perlin(vec2 const&,int,float,float): Fractal 2D noise in [0,1] summing octave layers of simplex noise, each layer scaled in amplitude by persistency and in frequency by frequency_gain (defaults 5, 0.3, 2).
noise_perlin(vec3 const&,int,float,float): Fractal 3D noise in [0,1] summing octave layers of simplex noise, each layer scaled in amplitude by persistency and in frequency by frequency_gain (defaults 5, 0.3, 2).
norm<T,N1,N2>(matrix_stack<T,N1,N2> const&): Frobenius norm of the matrix.
norm<T,N>(numarray_stack<T,N> const&): Euclidean length of the vector.
normal_per_vertex(numarray<vec3> const&,numarray<uint3> const&,bool): Per-vertex normals averaging the unit normals of adjacent triangles, flipped if invert is true.
normal_per_vertex(numarray<vec3> const&,numarray<uint3> const&,numarray<vec3>&,bool): Fill normals_to_fill with per-vertex normals averaging the unit normals of adjacent triangles (resized only if needed, flipped if invert is true).
normalize(quaternion const&): Unit quaternion in the same direction.
normalize<T,N>(numarray_stack<T,N> const&): Unit vector in the same direction (asserts on near-zero norm).
normalize<T,N>(numarray_stack<T,N> const&,numarray_stack<T,N> const&): Unit vector, returning a given default when the norm is near zero.
obj_read_faces(std::string const&,obj_type const): Read the faces of an .obj file as polygons of 0-based (position, uv, normal) index triplets, -1 marking a missing index.
obj_read_normals(std::string const&): Read only the vertex normals (vn lines) of an .obj file.
offset_grid(int,int,int): Linear offset k1 + N1*k2 of index (k1,k2) in a 2D grid of first dimension N1.
offset_grid(int,int,int,int,int): Linear offset k1 + N1*(k2 + N2*k3) of index (k1,k2,k3) in a 3D grid of dimensions N1 x N2 x N3.
offset_grid(int2 const&,int): Linear offset k.x + N1*k.y of a 2D index in a grid of first dimension N1.
offset_grid(int3 const&,int,int): Linear offset of a 3D index in a grid of dimensions N1 x N2 x N3.
offset_grid_stack<N1>(int,int): Linear offset k1 + N1*k2 of index (k1,k2) in a 2D grid whose first dimension N1 is known at compile time.
opengl_info_display(): String describing the OpenGL vendor, renderer, version and GLSL version (returned, not printed).
opengl_load_texture_image(grid_2D<vec3> const&,GLint,GLint): Upload a grid of vec3 colors as a new mipmapped 2D OpenGL texture (32-bit float RGB) with the given wrap modes, returning its id.
opengl_load_texture_image(image_structure const&,GLint,GLint): Upload an RGB or RGBA image as a new mipmapped 2D OpenGL texture (8 bits per channel) with the given wrap modes, returning its id.
opengl_load_texture_image(std::string const&,GLint,GLint): Load a PNG or JPEG file and upload it as a mipmapped 2D OpenGL texture, returning its id.
opengl_set_vao_location(opengl_vbo_structure const&,GLuint): Bind a VBO to a shader attribute location of the current VAO (glVertexAttribPointer), also setting the instancing divisor if the VBO has one.
opengl_uniform(opengl_shader_structure const&,std::string const&,GLuint,bool): Send an unsigned value as an int uniform (e.g. a texture unit) to the shader; warns if the uniform is not found and expected is true.
opengl_uniform(opengl_shader_structure const&,std::string const&,float,bool): Send a float uniform to the shader; warns if the uniform is not found and expected is true.
opengl_uniform(opengl_shader_structure const&,std::string const&,float,float,bool): Send a vec2 uniform given by its two components to the shader; warns if the uniform is not found and expected is true.
opengl_uniform(opengl_shader_structure const&,std::string const&,float,float,float,bool): Send a vec3 uniform given by its three components to the shader; warns if the uniform is not found and expected is true.
opengl_uniform(opengl_shader_structure const&,std::string const&,float,float,float,float,bool): Send a vec4 uniform given by its four components to the shader; warns if the uniform is not found and expected is true.
opengl_uniform(opengl_shader_structure const&,std::string const&,int,bool): Send an int uniform to the shader; warns if the uniform is not found and expected is true.
opengl_uniform(opengl_shader_structure const&,std::string const&,mat2 const&,bool): Send a mat2 uniform (row-major, transposed on upload) to the shader; warns if the uniform is not found and expected is true.
